{% extends 'base.html' %}
{% block content %}

<div class="max-w-md mx-auto px-4">
    <div class="bg-white rounded-lg shadow-md p-6 sm:p-8 border border-gray-200">
        <div class="text-center mb-6">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check-circle text-emerald-600 text-2xl sm:text-3xl"></i>
            </div>
            <h2 class="text-xl sm:text-2xl font-bold text-blue-900">Upload Successful</h2>
        </div>
        
        {% for message in messages %}
        <div class="bg-emerald-50 border-l-4 border-emerald-500 text-emerald-900 p-3 sm:p-4 mb-4 rounded-r-lg">
            <div class="flex items-center">
                <i class="fas fa-info-circle mr-2 sm:mr-3 flex-shrink-0"></i>
                <p class="text-sm sm:text-base">{{ message }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
